<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JunkiMC | Ultra Liquid Glass</title>
    
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: url('assets/macos-ventura.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* KHUNG KÍNH LỎNG 3D KHÔNG DÙNG SVG FILTER (CHỐNG LỖI CORS) */
        .container {
            width: 100%;
            max-width: 430px;
            padding: 45px 28px;
            text-align: center;
            position: relative;
            
            /* Dáng bo góc giọt nước bất đối xứng nhẹ mô phỏng chất lỏng tự nhiên (Fluid Shape) */
            border-radius: 48px 40px 45px 42px;
            
            /* Lớp nền mô phỏng độ dầy cô đặc của khối thủy tinh đổ khuôn */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.03) 40%, rgba(255, 255, 255, 0.12) 100%);
            
            /* Tăng độ nhòe sâu để bẻ cong luồng sáng phía sau */
            backdrop-filter: blur(30px) saturate(130%);
            -webkit-backdrop-filter: blur(30px) saturate(130%);
            
            /* Tạo viền nổi khối cơ học bóng loáng ôm sát mép kính */
            border-top: 3px solid rgba(255, 255, 255, 0.7);
            border-left: 2.5px solid rgba(255, 255, 255, 0.4);
            border-right: 1.5px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            
            /* Phức hợp bóng đổ đa tầng (Phản chiếu ánh sáng nội khối + Bóng tản bề mặt nền) */
            box-shadow: 
                inset 0 6px 16px rgba(255, 255, 255, 0.5),
                inset -4px -6px 16px rgba(0, 0, 0, 0.08),
                0 10px 30px rgba(0, 0, 0, 0.1),
                0 35px 70px rgba(0, 0, 0, 0.35);
        }

        /* Vệt sáng bóng loáng phản chiếu chạy chéo dọc thân kính */
        .container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            background: linear-gradient(105deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0) 80%, rgba(255, 255, 255, 0.1) 100%);
            pointer-events: none;
        }

        /* Avatar phom vuông bo mượt chuẩn chỉnh đĩa nhạc mẫu */
        .avatar {
            width: 105px;
            height: 105px;
            border-radius: 30px; 
            border: 2px solid rgba(255, 255, 255, 0.6);
            object-fit: cover;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
            margin-bottom: 4px;
        }

        /* Chữ căng nét, nổi bật trên nền kính */
        h1 {
            color: #ffffff;
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.022em;
            margin: 16px 0 6px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .bio-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 35px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Nút bấm giọt nước thủy tinh bóng bẩy */
        .bio-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16.5px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            border-top: 1.5px solid rgba(255, 255, 255, 0.55);
            border-left: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.011em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            
            box-shadow: 
                inset 0 2.5px 5px rgba(255, 255, 255, 0.3),
                0 4px 15px rgba(0, 0, 0, 0.12);
                
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), 
                        background-color 0.3s ease, 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
        }

        /* Hiệu ứng đàn hồi và đổi màu khúc xạ sáng khi di chuột */
        .bio-link:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.07) 100%);
            border-color: rgba(255, 255, 255, 0.7);
            transform: scale(1.035) translateY(-1px);
            box-shadow: 
                inset 0 4px 10px rgba(255, 255, 255, 0.4),
                0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .bio-link:active {
            transform: scale(0.975);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="assets/avatar.webp" alt="JunkiMC Avatar" class="avatar">
        
        <h1>JunkiMC</h1>
        <p class="bio-text">Minecraft creator. Builds, mods & chaos. Catch me on the links below.</p>

        <div class="links-group">
            <a href="https://youtube.com" target="_blank" class="bio-link">YouTube</a>
            <a href="https://discord.com" target="_blank" class="bio-link">Discord</a>
            <a href="https://twitter.com" target="_blank" class="bio-link">Twitter / X</a>
        </div>
    </div>

</body>
</html>
