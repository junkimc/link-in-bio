<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JunkiMC | Ultra Liquid Glass</title>
    
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1a1c29; 
            background-image: url('assets/macos-ventura.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* KHUNG CHỨA HIỆU ỨNG THỦY TINH LỎNG ĐÚC NGUYÊN KHỐI */
        .container {
            width: 100%;
            max-width: 430px;
            padding: 50px 30px;
            text-align: center;
            position: relative;
            
            /* Sử dụng ma trận bo góc hữu cơ (Organic Border Radius) tạo dáng chảy tự nhiên của chất lỏng */
            border-radius: 60px 40px 70px 50px / 50px 65px 45px 60px;
            
            /* Lớp nền mô phỏng độ đặc cao của kính đổ khuôn */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.04) 50%, rgba(255, 255, 255, 0.15) 100%);
            
            /* Làm nhòe sâu hậu cảnh tạo độ khúc xạ */
            backdrop-filter: blur(30px) saturate(140%);
            -webkit-backdrop-filter: blur(30px) saturate(140%);
            
            /* Đường viền nổi khối cơ học mô phỏng ánh sáng gắt ở mép chất lỏng */
            border-top: 3.5px solid rgba(255, 255, 255, 0.75);
            border-left: 3px solid rgba(255, 255, 255, 0.45);
            border-right: 1.5px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.1);
            
            /* Phức hợp bóng đổ tạo độ sâu tách khối hoàn toàn khỏi hình nền */
            box-shadow: 
                inset 0 8px 20px rgba(255, 255, 255, 0.45),
                inset -6px -8px 20px rgba(0, 0, 0, 0.1),
                0 15px 35px rgba(0, 0, 0, 0.2),
                0 40px 80px rgba(0, 0, 0, 0.4);
            
            /* Kích hoạt chuyển động mượt mà khi tương tác */
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* TẠO ĐƯỜNG SÓNG CHẤT LỎNG BẺ CONG ÁNH SÁNG (GIẢ LẬP LIQUID GLASS) */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            
            /* Dải màu khúc xạ ánh sáng chạy dọc theo gợn sóng chất lỏng */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 50%, rgba(255, 255, 255, 0.15) 100%);
            
            /* Cắt bề mặt bằng cấu trúc uốn lượn ngẫu nhiên mô phỏng vệt kính lỏng */
            clip-path: polygon(0% 20%, 35% 15%, 65% 28%, 100% 18%, 100% 85%, 70% 95%, 30% 82%, 0% 90%);
            
            opacity: 0.6;
            pointer-events: none;
            z-index: -1;
        }

        /* Avatar phom vuông bo mượt chuẩn Apple Music */
        .avatar {
            width: 105px;
            height: 105px;
            border-radius: 32px; 
            border: 2px solid rgba(255, 255, 255, 0.6);
            object-fit: cover;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            margin-bottom: 4px;
        }

        h1 {
            color: #ffffff;
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.022em;
            margin: 16px 0 6px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        }

        .bio-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 35px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Nút bấm giọt nước chất lỏng (Tự động méo nhẹ góc khi hover) */
        .bio-link {
            display: flex;
