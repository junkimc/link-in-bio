<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JunkiMC | Link-in-Bio</title>
    
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Khung chứa chính phong cách kính Clear Glass */
        .container {
            width: 100%;
            max-width: 430px;
            padding: 40px 24px;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            object-fit: cover;
        }

        h1 {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.022em;
            margin: 16px 0 6px 0;
        }

        .bio-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 32px;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Nút bấm Clear Glass gốc */
        .bio-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.011em;
            box-shadow: inset 0 1px 0px rgba(255, 255, 255, 0.1), 0 4px 12px rgba(0, 0, 0, 0.15);
            
            /* Định nghĩa thuộc tính chuyển động mượt mà sử dụng Cubic-Bezier của Apple */
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                        background-color 0.3s ease, 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
        }

        /* Hiệu ứng nâng cao khi di chuột đến (Hover) */
        .bio-link:hover {
            background-color: rgba(255, 255, 255, 0.08); /* Tăng độ sáng nền kính */
            border-color: rgba(255, 255, 255, 0.45); /* Viền trắng sáng rõ hơn */
            transform: scale(1.025); /* Phóng to nhẹ 2.5% tạo độ nổi khối vật lý */
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35); /* Đổ bóng sâu hơn xuống nền */
        }

        /* Hiệu ứng khi nhấn giữ chuột (Click) */
        .bio-link:active {
            transform: scale(0.98); /* Lõm nhẹ xuống tạo cảm giác như nút bấm thật */
            background-color: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb" alt="JunkiMC Avatar" class="avatar">
        
        <h1>JunkiMC</h1>
        <p class="bio-text">Minecraft creator. Builds, mods & chaos. Catch me on the links below.</p>

        <div class="links-group">
            <a href="https://youtube.com" target="_blank" class="bio-link">YouTube</a>
            <a href="https://discord.com" target="_blank" class="bio-link">Discord</a>
            <a href="https://twitter.com" target="_blank" class="bio-link">Twitter / X</a>
        </div>
    </div>

</body>
</html>
