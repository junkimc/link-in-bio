<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JunkiMC | Ultra Liquid Glass</title>
    
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1970&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Khung chứa hiệu ứng kính lỏng (Liquid Glass Base) */
        .container {
            width: 100%;
            max-width: 430px;
            padding: 45px 28px;
            border-radius: 40px;
            position: relative;
            text-align: center;
            
            /* Lớp nền mô phỏng độ dày giọt nước đặc */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(255, 255, 255, 0.08) 100%);
            
            /* Tăng mật độ khúc xạ ánh sáng nền phía sau */
            backdrop-filter: blur(25px) saturate(140%);
            -webkit-backdrop-filter: blur(25px) saturate(140%);
            
            /* Đổ khối viền bóng láng dầy quanh mép kính */
            border-top: 2.5px solid rgba(255, 255, 255, 0.65);
            border-left: 2.5px solid rgba(255, 255, 255, 0.35);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            
            /* Bóng đổ sâu đa tầng tạo độ nổi khối 3D tách biệt khỏi màn hình */
            box-shadow: 
                inset 0 4px 12px rgba(255, 255, 255, 0.4),
                inset 0 -4px 12px rgba(0, 0, 0, 0.15),
                0 4px 30px rgba(0, 0, 0, 0.1),
                0 30px 60px rgba(0, 0, 0, 0.35);
        }

        /* Tạo lớp phủ bẻ cong Liquid chạy ngầm ở viền để chữ và avatar KHÔNG bị nhòe */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 40px;
            background: transparent;
            z-index: -1;
            filter: url('#fluid-distortion');
            pointer-events: none;
        }

        /* Avatar bo góc chuẩn Mac, đổ bóng chìm sâu vào khối kính */
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 28px; /* Bo vuông góc mềm mượt chuẩn mẫu */
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            margin-bottom: 6px;
        }

        /* Nội dung Text căng nét tuyệt đối */
        h1 {
            color: #ffffff;
            font-size: 1.65rem;
            font-weight: 600;
            letter-spacing: -0.022em;
            margin: 14px 0 6px 0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .bio-text {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 35px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Nút bấm giọt nước thủy tinh bóng loáng */
        .bio-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            border-top: 1.5px solid rgba(255, 255, 255, 0.5);
            border-left: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.011em;
            
            box-shadow: 
                inset 0 2px 4px rgba(255, 255, 255, 0.25),
                0 4px 15px rgba(0, 0, 0, 0.15);
                
            /* Đàn hồi siêu mượt bằng hàm Mac Cubic-Bezier */
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), 
                        background-color 0.3s ease, 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
        }

        /* Hiệu ứng tương tác Liquid-Swell khi rà chuột */
        .bio-link:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.06) 100%);
            border-color: rgba(255, 255, 255, 0.65);
            transform: scale(1.03) translateY(-1px);
            box-shadow: 
                inset 0 4px 8px rgba(255, 255, 255, 0.35),
                0 12px 28px rgba(0, 0, 0, 0.3);
        }

        .bio-link:active {
            transform: scale(0.975);
        }

        /* Ẩn bộ lọc SVG trên màn hình */
        .liquid-filter {
            position: absolute;
            width: 0; height: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <svg class="liquid-filter">
        <defs>
            <filter id="fluid-distortion">
                <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="container">
        <img src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=1974&auto=format&fit=crop" alt="JunkiMC Avatar" class="avatar">
        
        <h1>JunkiMC</h1>
        <p class="bio-text">Minecraft creator. Builds, mods & chaos. Catch me on the links below.</p>

        <div class="links-group">
            <a href="https://youtube.com" target="_blank" class="bio-link">YouTube</a>
            <a href="https://discord.com" target="_blank" class="bio-link">Discord</a>
            <a href="https://twitter.com" target="_blank" class="bio-link">Twitter / X</a>
        </div>
    </div>

</body>
</html>
